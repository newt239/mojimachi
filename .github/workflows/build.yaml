name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      SPARKLE_VERSION: 2.6.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "::notice::バージョン ${version} でビルドします。"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Archive
        run: |
          xcodebuild -project apple/Mojimachi.xcodeproj -scheme Mojimachi \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath .build -archivePath .build/Mojimachi.xcarchive \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGNING_ALLOWED=NO archive

      - name: Create disk image
        run: |
          mkdir -p .build/dmg/staging .build/dist
          cp -R .build/Mojimachi.xcarchive/Products/Applications/mojimachi.app .build/dmg/staging/
          ln -s /Applications .build/dmg/staging/Applications
          hdiutil create -volname "もじまち" -srcfolder .build/dmg/staging \
            -ov -format UDZO ".build/dist/mojimachi-${{ steps.version.outputs.version }}.dmg"

      # SPARKLE_PRIVATE_KEY が未設定のあいだは appcast を作らない
      # 鍵の生成手順は docs/sparkle.md を参照
      - name: Generate appcast
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "::notice::SPARKLE_PRIVATE_KEY が未設定のため appcast を生成しません。自動アップデートは無効のままです。"
            echo "generated=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle && tar -xf sparkle.tar.xz -C sparkle
          printf '%s' "${SPARKLE_PRIVATE_KEY}" > .build/sparkle_key
          ./sparkle/bin/generate_appcast --ed-key-file .build/sparkle_key .build/dist
          rm -f .build/sparkle_key
          echo "generated=true" >> "${GITHUB_OUTPUT}"

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="変更点の詳細は[changelog](https://github.com/newt239/mojimachi/blob/main/CHANGELOG.md)をご確認ください。

          このアプリは署名・公証を行っていません。初回起動時は Finder で右クリックして「開く」を選んでください。"
          gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" --notes "${notes}"
          gh release upload "${GITHUB_REF_NAME}" .build/dist/*.dmg
          if [ "${{ steps.appcast.outputs.generated }}" = "true" ]; then
            gh release upload "${GITHUB_REF_NAME}" .build/dist/appcast.xml
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mojimachi-${{ steps.version.outputs.version }}
          path: .build/dist/
