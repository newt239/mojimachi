name: Mojimachi

options:
  bundleIdPrefix: dev.newt239
  createIntermediateGroups: true
  developmentLanguage: ja
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  Mojimachi:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: もじまち
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © newt239
        SUFeedURL: https://github.com/newt239/mojimachi/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: "rY9LEr5Aqz3pZd/D8/OPokRaBRT/pmEsE67A702ofN4="
    settings:
      base:
        PRODUCT_NAME: mojimachi
        PRODUCT_MODULE_NAME: Mojimachi
        PRODUCT_BUNDLE_IDENTIFIER: dev.newt239.mojimachi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

  MojimachiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Mojimachi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/mojimachi.app/Contents/MacOS/mojimachi
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Mojimachi:
    build:
      targets:
        Mojimachi: all
        MojimachiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MojimachiTests
