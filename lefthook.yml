pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{ts,tsx,js,json,css}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
      fail_text: TypeScript のフォーマットエラーがあります
    oxlint:
      glob: "*.{ts,tsx}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
      fail_text: oxlint のエラーがあります
    rustfmt:
      glob: "src-tauri/**/*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml
      stage_fixed: true
      fail_text: Rust のフォーマットエラーがあります
